<svg width="1400" height="360" viewBox="0 0 1400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">National Debt Statistics Investigation</title>
  <desc id="desc">A calm editorial banner about national debt, public credit, and statistics with an animated trend line.</desc>
  <defs>
    <pattern id="paper" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#202521" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="chartClip"><rect x="790" y="42" width="532" height="274" rx="8"/></clipPath>
  </defs>
  <rect width="1400" height="360" rx="16" fill="#f3f0e9"/>
  <rect width="1400" height="360" rx="16" fill="url(#paper)"/>
  <rect x="0" y="0" width="17" height="360" fill="#ef765c"/>
  <line x1="72" y1="42" x2="700" y2="42" stroke="#1d7771" stroke-width="3"/>
  <text x="72" y="82" fill="#1d7771" font-family="monospace" font-size="15" letter-spacing="4">FINANCE / STATISTICS / HISTORY</text>
  <text x="72" y="166" fill="#202521" font-family="Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">NATIONAL DEBT</text>
  <text x="75" y="216" fill="#1d7771" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">STATISTICS LAB</text>
  <text x="76" y="278" fill="#69716d" font-family="monospace" font-size="14" letter-spacing="1">PUBLIC CREDIT / ECONOMIC SURVIVAL</text>
  <text x="76" y="304" fill="#69716d" font-family="monospace" font-size="14" letter-spacing="1">A STUDENT INVESTIGATION</text>
  <rect x="790" y="42" width="532" height="274" rx="8" fill="#202521"/>
  <g clip-path="url(#chartClip)">
    <path d="M790 92H1322M790 150H1322M790 208H1322M790 266H1322" stroke="#f3f0e9" stroke-opacity=".12"/>
    <path d="M815 252 L900 238 L980 246 L1060 194 L1145 207 L1225 124 L1305 92" fill="none" stroke="#c8ef5a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M815 252 L900 238 L980 246 L1060 194 L1145 207 L1225 124 L1305 92" fill="none" stroke="#f0c75e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="620" stroke-dashoffset="620">
      <animate attributeName="stroke-dashoffset" from="620" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M815 252 L900 238 L980 246 L1060 194 L1145 207 L1225 124 L1305 92 L1305 316 L815 316Z" fill="#1d7771" fill-opacity=".28"/>
    <line x1="790" y1="150" x2="1322" y2="150" stroke="#ef765c" stroke-width="2" stroke-dasharray="8 8"/>
    <circle r="7" fill="#ef765c">
      <animateMotion dur="3s" repeatCount="indefinite" path="M815 252 L900 238 L980 246 L1060 194 L1145 207 L1225 124 L1305 92"/>
    </circle>
  </g>
  <text x="814" y="75" fill="#c8ef5a" font-family="monospace" font-size="12" letter-spacing="2">DEBT / GDP</text>
  <text x="1295" y="75" text-anchor="end" fill="#f3f0e9" fill-opacity=".8" font-family="monospace" font-size="12">2010-2024</text>
  <text x="814" y="343" fill="#69716d" font-family="monospace" font-size="11" letter-spacing="1">OBSERVE / QUESTION / MEASURE</text>
</svg>
